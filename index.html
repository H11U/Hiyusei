<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>飛遊星 | 自作曲・Webツール</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="飛遊星の公式サイトです。作曲やWebツール制作などの活動情報を掲載しています。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="site-label">Official Site</p>
      <h1>飛遊星</h1>
      <p class="site-description">
        作曲・Webツール制作などの活動情報を掲載しています。
      </p>

      <nav class="site-nav">
        <a href="#profile">プロフィール</a>
        <a href="#tools">Webツール</a>
        <a href="#music">自作曲</a>
        <a href="#links">YouTube / X</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="profile" class="card">
      <h2>プロフィール</h2>
      <p>
        ひゆーとして、作曲やWebツール制作などを行っています。
      </p>
    </section>

    <section id="tools" class="card">
      <h2>Webツール</h2>
      <p>
        日常や制作に役立つ小さなWebツールを公開しています。
      </p>

      <ul class="tool-list">
        <li>
          <div class="tool-item">
            <a href="https://h11u.github.io/Lyrics_Telop/" target="_blank" rel="noopener noreferrer">
              歌詞テロップ作成ツール
            </a>
            <a class="sub-link" href="使い方のリンクページ" target="_blank" rel="noopener noreferrer">
              使い方
            </a>
          </div>
        </li>
      </ul>
    </section>

    <section id="music" class="card">
      <h2>自作曲</h2>
      <p>
        制作した楽曲について、楽曲情報や関連データの配布案内を掲載しています。
      </p>
      <p>
        配布データには、オフボーカル音源、未マスタリング音源、歌詞テキスト、コード譜などがあります。
      </p>
    </section>

    <section id="links" class="card">
      <h2>YouTube / X</h2>
      <div class="link-buttons">
        <a class="button-link" href="www.youtube.com/@HiyuseiLab" target="_blank" rel="noopener noreferrer">
          YouTube
        </a>
        <a class="button-link secondary" href="Xリンク" target="_blank" rel="noopener noreferrer">
          X
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 飛遊星</p>
    </div>
  </footer>
</body>
</html>
