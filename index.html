<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>飛遊星 | 自作曲・Webツール</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="site-label">Official Site</p>
      <h1>飛遊星</h1>
      <p class="site-description">
        自作曲・Webツールなどを公開しています。
      </p>

      <nav class="site-nav">
        <a href="#profile">プロフィール</a>
        <a href="#music">自作曲</a>
        <a href="#youtube">YouTube</a>
        <a href="#tools">Webツール</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="profile" class="card">
      <h2>プロフィール</h2>
      <p>
        「ひゆー」として、自作曲やWebツール制作などを行っています。
      </p>
    </section>

    <section id="music" class="card">
      <h2>自作曲</h2>

    <section id="youtube" class="card">
      <h2>YouTube</h2>
      <p>
        YouTubeでは、一部の楽曲や関連コンテンツを公開しています。
      </p>
      <p class="button-row">
        <a class="button-link" href="www.youtube.com/@HiyuseiLab" target="_blank" rel="noopener noreferrer">
          YouTubeを見る
        </a>
      </p>

    <section id="tools" class="card">
      <h2>Webツール</h2>
      <p>
        日常に役立つ小さなWebツールを公開しています。
      </p>
      <ul class="tool-list">
        <li>
          <a href="https://h11u.github.io/Lyrics_Telop/" target="_blank" rel="noopener noreferrer">
            歌詞テロップ作成ツール
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 飛遊星</p>
    </div>
